group 'io.flutterfastkit.fk_user_agent'
version '2.0.0'

buildscript {
    repositories {
        google()
        // mavenCentral, not jcenter: Gradle 9 removed the jcenter() method outright, so a
        // consumer on Gradle 9 fails at project evaluation with "Could not find method
        // jcenter()". jcenter has been read-only since 2021, so nothing resolved from it anyway.
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.4.1'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    compileSdk 34
    namespace project.group

    defaultConfig {
        minSdk 16
    }

    lintOptions {
        disable 'InvalidPackage'
    }
}
